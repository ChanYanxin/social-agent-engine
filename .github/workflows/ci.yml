name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q social_agent tests scripts
      - run: python -m pytest -q
      - run: python -m social_agent.evaluation --mode all --cases 3 --filler 12
